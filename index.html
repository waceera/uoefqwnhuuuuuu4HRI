    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; user-select: none; -webkit-user-select: none; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.03); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(29, 185, 84, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(29, 185, 84, 0.6); }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin 15s linear infinite; }
        .animation-paused { animation-play-state: paused; }
        #bg-ambient { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; filter: blur(100px) saturate(150%); opacity: 0.45; transition: background 2.5s ease; }
        input[type="range"] { -webkit-appearance: none; appearance: none; background: rgba(255, 255, 255, 0.1); border-radius: 9999px; cursor: pointer; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #1db954; transition: all 0.15s ease-in-out; box-shadow: 0 0 10px rgba(29, 185, 84, 0.5); }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.3); background: #1ed760; }
        .wave-bar { width: 3px; height: 4px; background-color: #1db954; border-radius: 9999px; transition: height 0.1s ease; }
        .wave-active .wave-bar { animation: bounceWave 1.2s ease-in-out infinite alternate; }
        @keyframes bounceWave { 0% { height: 4px; } 100% { height: 28px; } }
    </style>
</head>

            let player, lyricsContainer, lyricsText, playIcon, albumArt, progressBar, volumeBar, currentTimeEl, totalDurationEl, waveContainer, playlistContainer, searchInput;
            let currentSongIndex = 0, isPlaying = false, isRepeat = false, isShuffle = false;

            function injectMainAppUI() {
                const container = document.getElementById('app-container');
                container.innerHTML = `

                                <button id="close-lyrics-btn" class="w-10 h-10 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center transition-all text-white hover:text-[#1db954]"><i class="fa-solid fa-times"></i></button>
                            </div>
                            <div class="flex-grow overflow-y-auto my-6 pr-2"><div id="lyrics-text" class="text-lg md:text-xl font-medium leading-relaxed text-gray-300 text-center whitespace-pre-line py-8">Memuat...</div></div>
                            <div class="text-center text-xs text-gray-500">Lirik disediakan secara otomatis oleh Musixmatch</div>
                        </div>
                        <div class="w-full lg:w-2/5 flex flex-col items-center justify-center border-b lg:border-b-0 lg:border-r border-white/10 pb-6 lg:pb-0 lg:pr-8">
                            <div class="relative group mb-6">
                                <div class="absolute inset-0 rounded-full bg-black/80 blur-md transition duration-500 group-hover:scale-105"></div>
                                <div class="relative w-48 h-48 md:w-56 md:h-56 mx-auto rounded-full p-2 bg-gradient-to-tr from-zinc-800 to-zinc-900 shadow-2xl flex items-center justify-center">
                                    <div class="absolute inset-2 rounded-full border border-zinc-700/50"></div><div class="absolute inset-6 rounded-full border border-zinc-800"></div><div class="absolute inset-10 rounded-full border border-zinc-700/50"></div>
                                    <img id="album-art" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231e1e24'/></svg>" alt="Cover Art" class="w-36 h-36 md:w-44 md:h-44 rounded-full object-cover animate-spin-slow animation-paused shadow-inner border-2 border-black" onerror="this.src='https://placehold.co/400x400/1e1e24/1db954?text=Shirotify'">
                                    <div class="absolute w-6 h-6 rounded-full bg-[#0b0c0e] border-2 border-zinc-800 z-10 flex items-center justify-center"><div class="w-1.5 h-1.5 rounded-full bg-white"></div></div>

                                    <button id="btn-play-pause" class="w-14 h-14 rounded-full bg-gradient-to-tr from-emerald-500 to-green-400 text-black flex items-center justify-center shadow-2xl shadow-emerald-500/50 hover:shadow-emerald-500/75 hover:scale-105 transition-all duration-200"><i id="play-icon" class="fa-solid fa-play text-2xl pl-1"></i></button>
                                    <button id="btn-next" class="text-gray-300 hover:text-white transition duration-200 text-xl" title="Selanjutnya"><i class="fa-solid fa-forward-step"></i></button>

                                </div>
                                <div class="flex items-center gap-3 mt-6 justify-end border-t border-white/5 pt-4"><i class="fa-solid fa-volume-low text-xs text-gray-400"></i><input type="range" id="volume-bar" min="0" max="1" step="0.05" value="0.8" class="w-24 h-1"><i class="fa-solid fa-volume-high text-xs text-gray-400"></i></div>
                                <audio id="audio-player" class="hidden" preload="auto"></audio>

                            <div class="flex flex-col flex-grow bg-white/[0.02] border border-white/5 rounded-2xl p-4 md:p-6 overflow-hidden">

                                <div id="playlist-wrapper" class="space-y-4 transition-all duration-300">
                                    <div class="relative"><span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400"><i class="fa-solid fa-magnifying-glass text-xs"></i></span><input type="text" id="search-input" placeholder="Cari lagu..." class="w-full pl-9 pr-4 py-2.5 bg-black/40 border border-white/10 rounded-xl text-xs text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500/50 transition"></div>

                    </div>`;
            }

            function initAppElements() {
                player = document.getElementById('audio-player');
                lyricsContainer = document.getElementById('lyrics-container');
                lyricsText = document.getElementById('lyrics-text');
                playIcon = document.getElementById('play-icon');
                albumArt = document.getElementById('album-art');
                progressBar = document.getElementById('progress-bar');
                volumeBar = document.getElementById('volume-bar');
                currentTimeEl = document.getElementById('current-time');
                totalDurationEl = document.getElementById('total-duration');
                waveContainer = document.getElementById('wave-container');
                playlistContainer = document.getElementById('playlist-container');
                searchInput = document.getElementById('search-input');

                document.getElementById('toggle-playlist-btn').onclick = togglePlaylist;
                document.getElementById('open-lyrics-btn').onclick = toggleLyrics;
                document.getElementById('close-lyrics-btn').onclick = toggleLyrics;
                document.getElementById('btn-play-pause').onclick = togglePlay;
                document.getElementById('btn-next').onclick = nextSong;
                document.getElementById('btn-prev').onclick = prevSong;
                document.getElementById('btn-repeat').onclick = toggleRepeat;
                document.getElementById('btn-shuffle').onclick = toggleShuffle;
                searchInput.onkeyup = filterSongs;

                player.addEventListener('timeupdate', () => {
                    if (!isNaN(player.duration)) {
                        progressBar.value = (player.currentTime / player.duration) * 100;
                        currentTimeEl.innerText = formatTime(player.currentTime);
                        totalDurationEl.innerText = formatTime(player.duration);
                    }
                });
                progressBar.addEventListener('input', () => { player.currentTime = (progressBar.value / 100) * player.duration; });
                volumeBar.addEventListener('input', () => { player.volume = volumeBar.value; });
                player.onended = () => { if (isRepeat) { player.currentTime = 0; player.play(); } else { nextSong(); } };
            }

            function togglePlaylist() {
                const wrapper = document.getElementById('playlist-wrapper');
                const btn = document.getElementById('toggle-playlist-btn');
                if (wrapper.style.maxHeight === '0px') {
                    wrapper.style.maxHeight = '500px'; wrapper.style.opacity = '1'; wrapper.style.marginTop = '1rem';
                    btn.innerHTML = '<span>▼ Sembunyikan</span>';
                } else {
                    wrapper.style.maxHeight = '0px'; wrapper.style.opacity = '0'; wrapper.style.marginTop = '0';
                    btn.innerHTML = '<span>▲ Tampilkan</span>';
                }
            }

            function toggleLyrics() { lyricsContainer.classList.toggle('translate-y-full'); }

            async function fetchLyrics(title, artist) {
                lyricsText.innerHTML = `<div class="flex flex-col items-center gap-3"><i class="fa-solid fa-spinner animate-spin text-[#1db954] text-3xl"></i><p class="text-sm text-gray-400 font-normal">Mengambil lirik lrc...</p></div>`;
                try {
                    const response = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(title + " " + artist)}`);
                    const data = await response.json();
                    if (data && data.length > 0) {
                        lyricsText.innerText = (data.find(item => item.plainLyrics) || data).plainLyrics || "Lirik kosong.";
                    } else {
                        lyricsText.innerHTML = `<p class="text-gray-500 italic text-base">Lirik tidak tersedia.</p>`;
                    }
                } catch (e) { lyricsText.innerHTML = `<p class="text-rose-400 text-sm">Gagal mengambil lirik.</p>`; }
            }

            function updateBG(url) {
                const img = new Image(); img.crossOrigin = "Anonymous"; img.src = url;
                img.onload = () => {
                    try {
                        const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d'); canvas.width = 1; canvas.height = 1;
                        ctx.drawImage(img, 0, 0, 1, 1);
                        document.getElementById('bg-ambient').style.background = `radial-gradient(circle, rgba(${ctx.getImageData(0, 0, 1, 1).data.slice(0,3).join(',')}, 0.8) 0%, rgba(11,12,14, 1) 85%)`;
                    } catch (e) { resetBG(); }
                };
                img.onerror = resetBG;
            }
            function resetBG() { document.getElementById('bg-ambient').style.background = `radial-gradient(circle, rgba(29, 185, 84, 0.4) 0%, rgba(11,12,14, 1) 85%)`; }

            function playSong(song, index) {
                currentSongIndex = index;
                document.title = "▶ " + song.title + " - " + song.artist;
                document.getElementById('title').innerText = song.title;
                document.getElementById('artist').innerText = song.artist;
                albumArt.src = song.cover;
                player.src = song.url;
                player.play().then(() => {
                    isPlaying = true; playIcon.className = "fa-solid fa-pause text-2xl";
                    albumArt.classList.remove('animation-paused'); waveContainer.classList.add('wave-active');
                }).catch(e => console.log(e));
                updateBG(song.cover); fetchLyrics(song.title, song.artist); highlightActiveSong();
            }

            function highlightActiveSong() {
                document.querySelectorAll('.song-item').forEach((item, idx) => {
                    const isCurrent = idx === currentSongIndex;
                    item.classList.toggle('bg-emerald-500/10', isCurrent);
                    item.classList.toggle('border-emerald-500/30', isCurrent);
                    item.querySelector('.item-title').classList.toggle('text-emerald-400', isCurrent);
                    item.querySelector('.play-now-indicator').style.display = isCurrent ? 'block' : 'none';
                });
            }

            function togglePlay() {
                if (isPlaying) {
                    player.pause(); isPlaying = false; playIcon.className = "fa-solid fa-play text-2xl pl-1";
                    albumArt.classList.add('animation-paused'); waveContainer.classList.remove('wave-active');
                } else if(player.src) {
                    player.play(); isPlaying = true; playIcon.className = "fa-solid fa-pause text-2xl";
                    albumArt.classList.remove('animation-paused'); waveContainer.classList.add('wave-active');
                } else {
                    // Jika player.src masih kosong (inisialisasi awal di Android), muat lagu pertama saat tombol play ditekan
                    playSong(songs[currentSongIndex], currentSongIndex);
                }
            }

            function nextSong() { let idx = isShuffle ? Math.floor(Math.random() * songs.length) : (currentSongIndex + 1) % songs.length; playSong(songs[idx], idx); }
            function prevSong() { let idx = (currentSongIndex - 1 + songs.length) % songs.length; playSong(songs[idx], idx); }
            function toggleRepeat() { isRepeat = !isRepeat; document.getElementById('btn-repeat').classList.toggle('text-emerald-400', isRepeat); document.getElementById('btn-repeat').classList.toggle('text-gray-400', !isRepeat); }
            function toggleShuffle() { isShuffle = !isShuffle; document.getElementById('btn-shuffle').classList.toggle('text-emerald-400', isShuffle); document.getElementById('btn-shuffle').classList.toggle('text-gray-400', !isShuffle); }

            function renderPlaylist(data) {
                playlistContainer.innerHTML = "";
                data.forEach((s, idx) => {
                    const d = document.createElement('div');
                    d.className = 'song-item flex items-center justify-between p-3 cursor-pointer rounded-xl border border-transparent hover:bg-white/[0.05] transition-all duration-300';
                    d.innerHTML = `<div class="flex items-center gap-3 w-4/5"><div class="w-10 h-10 rounded-lg bg-zinc-800 overflow-hidden flex-shrink-0"><img src="${s.cover}" class="w-full h-full object-cover"></div><div class="truncate"><h4 class="item-title font-bold text-sm text-gray-200 truncate">${s.title}</h4><p class="text-xs text-gray-500 truncate">${s.artist}</p></div></div><div class="flex items-center gap-2"><span class="play-now-indicator text-[10px] text-emerald-400 font-semibold animate-pulse" style="display:none;">Diputar</span><div class="w-8 h-8 rounded-full bg-white/5 hover:bg-[#1db954] hover:text-black flex items-center justify-center text-xs transition duration-300"><i class="fa-solid fa-play"></i></div></div>`;
                    d.onclick = () => playSong(s, idx); playlistContainer.appendChild(d);
                });
            }

            function filterSongs() { renderPlaylist(songs.filter(i => i.title.toLowerCase().includes(searchInput.value.toLowerCase()) || i.artist.toLowerCase().includes(searchInput.value.toLowerCase()))); }
            function formatTime(s) { return `${Math.floor(s / 60).toString().padStart(2, '0')}:${Math.floor(s % 60).toString().padStart(2, '0')}`; }

            // MODIFIKASI FIX ANDROID: Hanya muat metadata di awal, tidak memaksa set player.src sebelum interaksi user
            document.addEventListener("DOMContentLoaded", function() {
                injectMainAppUI();
                initAppElements();
                renderPlaylist(songs);
                if (songs.length > 0) {
                    const s = songs;
                    document.getElementById('title').innerText = s.title;
                    document.getElementById('artist').innerText = s.artist;
                    albumArt.src = s.cover; 
                    // player.src sengaja dikosongkan agar WebView Android tidak memblokir autoplay ilegal
                    updateBG(s.cover); 
                    highlightActiveSong();
                }
            });

        })();
    </script>
</body>
</html>
